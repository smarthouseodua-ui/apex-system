pipeline:
  cycle_interval: 300
  max_cycles: 0
  mode: simulation
  modules:
    execution_engine: true
    finalizer: true
    position_manager: true
    risk_manager: true
    scanner: true
    signal_gate: true
    strategy_engine: true
  notifications:
    on_error: true
    on_trade_close: true
    on_trade_open: true
    telegram: false
  strategies:
    orb:
      enabled: true
      timeframes:
      - 1m
      - 15m
    smc:
      enabled: true
      timeframes:
      - 15m
      - 1h
      - 4h
