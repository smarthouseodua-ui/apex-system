# APEX PROTOCOL™ — Risk Config

risk:
  # Баланс
  balance_usdt: 10000

  # Размер позиции — фиксированный $10 (приоритет над risk_per_trade_pct)
  fixed_size_usdt: 10

  # Резервный режим (если fixed_size_usdt не задан)
  risk_per_trade_pct: 0.1

  # SL / TP по процентам от entry (приоритет над sl_distance * rr)
  sl_pct:  0.4      # SL  = -0.4%
  tp1_pct: 0.4      # TP1 = +0.4%
  tp2_pct: 0.4      # TP2 = +0.4%
  tp3_pct: 0.4      # TP3 = +0.4%

  # Прочие параметры
  max_trade_minutes:  20
  max_daily_loss_pct: 5.0
  max_drawdown_pct:   15.0
  leverage:           1
  rr_ratio:           2.0
  max_positions:      5

  # TP распределение (% от позиции)
  tp1_close_pct: 50
  tp2_close_pct: 30
  tp3_close_pct: 20

  # Trailing SL
  trailing_sl_enabled:    false
  trailing_sl_activation: 1.0
  trailing_sl_step:       0.5

  # Сессионные ограничения
  blocked_hours: [13]
  allowed_sessions: ["HONG_KONG", "LONDON", "NEW_YORK", "ASIA"]

  # Сессионные фильтры (направление)
  session_filters:
    HONG_KONG:
      direction: "buy"
    NEW_YORK:
      direction: "sell"
    LONDON:
      direction: "both"
    ASIA:
      direction: "both"
