# APEX PROTOCOL™ — System Config

system:
  name: "APEX PROTOCOL™"
  version: "1.0.0"
  mode: "simulation"
  cycle_interval: 60
  timezone: "Europe/Podgorica"

scanner:
  min_volume: 100000
  min_volatility: 0.3
  max_volatility: 15.0
  max_candidates: 100
  quote_currency: "USDT"      # только USDT пары
  blacklist:
    - "DOGE/USDT:USDT"
    - "RIVER/USDT:USDT"
    - "G/USDT:USDT"
    - "SPX/USDT:USDT"

cycle_interval: 15

max_positions: 100
cooldown_minutes: 15

signal_gate:
  cooldown_minutes: 15
  max_positions: 100

risk:
  balance_usdt: 1000
  risk_per_trade_pct: 1.0
  leverage: 10
  rr_ratio: 2.0

logging:
  level: "INFO"
  file: "logs/system.log"
  trades_file: "logs/trades.log"
  errors_file: "logs/errors.log"
